name: 🏗️ Build and Cache Base Images

on:
  push:
    paths:
      - 'requirements.txt'
      - 'docker/test/Dockerfile.*'
      - '.github/workflows/build-base-image.yml'
    branches: [ "main", "dev" ]
  workflow_dispatch:
  schedule:
    # Rebuild base image weekly (every Sunday at 2 AM UTC)
    - cron: '0 2 * * 0'

env:
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: ${{ github.repository }}/test-base

jobs:
  build-base:
    name: 🏗️ Build and Cache Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/test/Dockerfile.base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=base-image
          cache-to: type=gha,mode=max,scope=base-image
          platforms: linux/amd64

  test-base-image:
    name: 🧪 Test Base Image
    needs: build-base
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧪 Test base image functionality
        run: |
          echo "🧪 Testing base image..."
          docker run --rm ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:latest python -c "
          import sys
          print(f'Python version: {sys.version}')
          
          # Test TA-Lib installation
          try:
              import talib
              print('✅ TA-Lib imported successfully')
          except ImportError as e:
              print(f'❌ TA-Lib import failed: {e}')
              sys.exit(1)
          
          # Test PostgreSQL client
          import subprocess
          result = subprocess.run(['pg_isready', '--help'], capture_output=True)
          if result.returncode == 0:
              print('✅ PostgreSQL client available')
          else:
              print('❌ PostgreSQL client not found')
              sys.exit(1)
          
          print('🎉 Base image test completed successfully!')
          "
