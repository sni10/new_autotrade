name: 🧪 Python Tests with PostgreSQL

on:
  pull_request:
    branches: [ "dev", "stage", "release/*", "main" ]
  push:
    branches: [ "dev", "stage", "release/*", "main" ]
  workflow_dispatch:

jobs:
  test:
    name: 🔍 Run Pytest with PostgreSQL Database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔧 Create necessary directories
        run: |
          mkdir -p htmlcov
          mkdir -p .pytest_cache

      - name: 🧪 Run tests with PostgreSQL using docker-compose
        run: |
          echo "🚀 Starting PostgreSQL and running tests..."
          docker-compose -f docker/test/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test-runner
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1

      - name: 📋 Show detailed logs (if failed)
        if: failure()
        run: |
          echo "📋 PostgreSQL logs:"
          docker-compose -f docker/test/docker-compose.test.yml logs postgres-test || echo "No PostgreSQL logs available"
          echo ""
          echo "📋 Test runner logs:"
          docker-compose -f docker/test/docker-compose.test.yml logs test-runner || echo "No test runner logs available"

      - name: 📊 Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7

      - name: 🧹 Clean up containers
        if: always()
        run: |
          docker-compose -f docker/test/docker-compose.test.yml down -v --remove-orphans || true
          docker system prune -f || true
