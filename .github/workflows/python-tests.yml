name: 🧪 Python Tests with PostgreSQL

on:
  pull_request:
    branches: [ "dev", "stage", "release/*", "main" ]
  push:
    branches: [ "dev", "stage", "release/*", "main" ]

jobs:
  test:
    name: 🔍 Run Tests with PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: autotrade_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 🏗️ Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget postgresql-client

      - name: 📦 Install TA-Lib
        run: |
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist pytest-asyncio

      - name: 🔧 Configure test database
        run: |
          # Update config.json for tests
          python -c "
          import json
          import os
          config_path = 'src/config/config.json'
          if os.path.exists(config_path):
              with open(config_path, 'r') as f:
                  config = json.load(f)
              config['database'] = {
                  'host': 'localhost',
                  'port': 5432,
                  'database': 'autotrade_test',
                  'username': 'test_user',
                  'password': 'test_password'
              }
              with open(config_path, 'w') as f:
                  json.dump(config, f, indent=2)
              print('✅ Config updated for tests')
          "

      - name: 🧪 Run tests with pytest
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python -m pytest tests/ -v --tb=short --maxfail=5
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: autotrade_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password

      - name: 📊 Generate coverage report
        if: always()
        run: |
          python -m pytest tests/ --cov=src --cov-report=html --cov-report=xml --cov-report=term-missing || true

      - name: 📤 Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
