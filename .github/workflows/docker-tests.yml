name: 🧪 Python Tests with Docker Cache

on:
  pull_request:
    branches: [ "dev", "stage", "release/*", "main" ]
  push:
    branches: [ "dev", "stage", "release/*", "main" ]

jobs:
  test:
    name: 🔍 Run Tests with Cached Docker
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and cache test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/test/Dockerfile.test
          push: true
          tags: ghcr.io/${{ github.repository }}/test-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🧪 Run tests with Docker Compose
        run: |
          echo "🚀 Starting PostgreSQL and running tests..."
          docker compose -f docker/test/docker-compose.test.yml up --abort-on-container-exit --exit-code-from test-runner
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1

      - name: 📤 Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            htmlcov/
            coverage.xml
